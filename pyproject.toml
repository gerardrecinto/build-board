[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "build-board"
version = "0.1.0"
description = "Build order, affected modules, coverage gates and a static build and coverage page for multi-module SDK builds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
build-board = "build_board.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
